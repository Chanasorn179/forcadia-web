services:
  postgres:
    image: postgres:17-alpine
    container_name: forcadia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: forcadia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: forcadia
    ports:
      - "5432:5432"
    volumes:
      - forcadia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U forcadia -d forcadia",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forcadia_postgres_data:
